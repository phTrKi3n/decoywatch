#!/usr/sbin/nft -f
flush ruleset
table inet cowrie_lab {
  chain input {
    type filter hook input priority filter; policy drop;
    iifname "lo" accept
    ct state established,related accept
    iifname "ens33" udp sport 67 udp dport 68 accept
    iifname "ens37" ip saddr 192.168.100.1 ip daddr 192.168.100.20 icmp type echo-request accept
    iifname "ens37" ip saddr 192.168.100.0/24 ip daddr 192.168.100.20 tcp dport 2222 accept
    iifname "ens37" ip saddr 192.168.100.1 ip daddr 192.168.100.20 tcp dport 443 accept
    iifname "ens37" ip daddr 192.168.100.20 meta l4proto tcp ct state new limit rate 50/second burst 50 packets log prefix "LAB_WAN_BLOCK " counter
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
    meta skuid @COWRIE_UID@ oifname "ens37" ip saddr 192.168.100.20 ip daddr 192.168.100.0/24 tcp sport 2222 ct direction reply ct state established accept
    meta skuid @COWRIE_UID@ counter drop
  }
}
