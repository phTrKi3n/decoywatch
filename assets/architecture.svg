<svg xmlns="http://www.w3.org/2000/svg" width="600" height="920" viewBox="0 0 600 920" role="img" aria-labelledby="title description">
  <title id="title">Hai nguồn phát hiện, một luồng cảnh báo Telegram</title>
  <desc id="description">Máy khách Host-only đi qua nftables. SSH tới Cowrie và log chặn tới bộ tương quan. Hai nguồn JSON vào Wazuh Manager. Manager gửi cảnh báo Telegram qua NAT và chuyển cảnh báo tới Indexer để Dashboard tra cứu. Các thành phần xử lý chạy trong một VM Ubuntu.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#345a80"/></marker>
  </defs>
  <rect width="600" height="920" rx="14" fill="#f5f8fc"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#152c45" text-anchor="middle">
    <rect x="144" y="20" width="312" height="86" rx="12" fill="#fff" stroke="#8097af"/>
    <text x="300" y="55" font-size="25" font-weight="600">Máy khách lab</text>
    <text x="300" y="84" font-size="21">Windows / Linux · Host-only</text>
    <rect x="18" y="132" width="564" height="622" rx="15" fill="#fff" stroke="#94acc3" stroke-width="1.5" stroke-dasharray="6 5"/>
    <path d="M300 106V174" fill="none" stroke="#345a80" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="48" y="160" text-anchor="start" font-size="21" font-weight="600">Ubuntu Server · 1 VM</text>
    <rect x="48" y="178" width="504" height="75" rx="10" fill="#e5eef8" stroke="#7697b9"/>
    <text x="300" y="209" font-size="26" font-weight="600">nftables</text>
    <text x="300" y="236" font-size="21">Lọc lưu lượng vào mạng lab</text>
    <path d="M176 253V300M424 253V300" fill="none" stroke="#345a80" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="48" y="306" width="236" height="105" rx="10" fill="#eef4fb" stroke="#7697b9"/>
    <text x="166" y="339" font-size="25" font-weight="600">Cowrie SSH</text>
    <text x="166" y="368" font-size="21">Bẫy shell giả lập</text>
    <text x="166" y="394" font-size="21">TCP 2222</text>
    <rect x="316" y="306" width="236" height="105" rx="10" fill="#fff3df" stroke="#b99251"/>
    <text x="434" y="339" font-size="24" font-weight="600">Bộ tương quan</text>
    <text x="434" y="368" font-size="21">Log kết nối bị chặn</text>
    <text x="434" y="394" font-size="21">≥5 cổng / 30 giây</text>
    <path d="M166 411V450H258V476M434 411V450H342V476" fill="none" stroke="#345a80" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="166" y="438" font-size="20">JSON</text>
    <text x="434" y="438" font-size="20">JSON</text>
    <rect x="102" y="482" width="396" height="85" rx="10" fill="#183a5e"/>
    <text x="300" y="518" font-size="27" font-weight="600" fill="#fff">Wazuh Manager</text>
    <text x="300" y="547" font-size="21" fill="#e4eef9">Phân tích log · áp quy tắc</text>
    <path d="M240 567V611H166V630" fill="none" stroke="#345a80" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="48" y="636" width="236" height="80" rx="10" fill="#eef4fb" stroke="#7697b9"/>
    <text x="166" y="670" font-size="24" font-weight="600">Indexer</text>
    <text x="166" y="697" font-size="21">Lưu cảnh báo</text>
    <path d="M284 676H310" fill="none" stroke="#345a80" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="316" y="636" width="236" height="80" rx="10" fill="#eef4fb" stroke="#7697b9"/>
    <text x="434" y="670" font-size="24" font-weight="600">Dashboard</text>
    <text x="434" y="697" font-size="21">Tra cứu qua LAN</text>
    <path d="M498 525H566V783H300V807" fill="none" stroke="#345a80" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="308" y="760" width="242" height="29" fill="#f5f8fc"/>
    <text x="429" y="781" font-size="20">HTTPS · ens33 / NAT</text>
    <rect x="102" y="813" width="396" height="80" rx="10" fill="#e2f2ec" stroke="#6b9c87"/>
    <text x="300" y="847" font-size="27" font-weight="600">Telegram</text>
    <text x="300" y="876" font-size="21">Cảnh báo tới chat đã cấu hình</text>
    <text x="300" y="739" font-size="19">Cowrie bị chặn kết nối mới ra ngoài VM.</text>
  </g>
</svg>
