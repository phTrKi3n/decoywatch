services:
  soc-detector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cowrie-wazuh-soc-detector:local
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    network_mode: "none"
    volumes:
      - ../wazuh/fixtures:/app/fixtures:ro
    command: ["--self-test", "--fixtures", "/app/fixtures"]
